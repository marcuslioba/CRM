<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coleta de Dados</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f2f5;
    color: #333;
    min-height: 100vh;
  }

  header {
    background: #1a73e8;
    color: white;
    padding: 20px 32px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }

  header h1 { font-size: 1.4rem; font-weight: 600; }

  .reload-btn {
    margin-left: auto;
    background: rgba(255,255,255,0.2);
    border: none;
    color: white;
    padding: 8px 16px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: background 0.2s;
  }
  .reload-btn:hover { background: rgba(255,255,255,0.35); }

  .container { padding: 24px 32px; }

  /* Cards de resumo */
  .cards {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }

  .card {
    background: white;
    border-radius: 10px;
    padding: 18px 24px;
    flex: 1;
    min-width: 150px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    border-left: 4px solid #1a73e8;
  }

  .card .label { font-size: 0.78rem; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
  .card .value { font-size: 1.8rem; font-weight: 700; color: #1a73e8; margin-top: 4px; }

  /* Filtros */
  .filters {
    background: white;
    border-radius: 10px;
    padding: 18px 20px;
    margin-bottom: 20px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }

  .filter-group { display: flex; flex-direction: column; gap: 4px; }
  .filter-group label { font-size: 0.78rem; color: #666; font-weight: 500; }

  .filters input, .filters select {
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 0.9rem;
    background: #fafafa;
    color: #333;
    min-width: 140px;
  }

  .filters input:focus, .filters select:focus {
    outline: none;
    border-color: #1a73e8;
    background: white;
  }

  .btn-limpar {
    padding: 8px 16px;
    background: #f1f3f4;
    border: 1px solid #ddd;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    color: #555;
    align-self: flex-end;
    transition: background 0.2s;
  }
  .btn-limpar:hover { background: #e0e0e0; }

  /* Tabela */
  .table-wrap {
    background: white;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    overflow: hidden;
  }

  .table-info {
    padding: 12px 20px;
    font-size: 0.85rem;
    color: #888;
    border-bottom: 1px solid #f0f0f0;
  }

  .table-scroll { overflow-x: auto; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }

  thead th {
    background: #f8f9fa;
    padding: 12px 16px;
    text-align: left;
    font-weight: 600;
    color: #555;
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    border-bottom: 2px solid #e8e8e8;
    white-space: nowrap;
  }

  tbody tr { border-bottom: 1px solid #f5f5f5; transition: background 0.15s; }
  tbody tr:hover { background: #f0f6ff; }

  td {
    padding: 11px 16px;
    color: #444;
    white-space: nowrap;
  }

  /* Badges */
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 0.78rem;
    font-weight: 500;
  }

  .badge-elogio    { background: #e6f4ea; color: #137333; }
  .badge-reclamacao { background: #fce8e6; color: #c5221f; }
  .badge-sugestao  { background: #e8f0fe; color: #1a73e8; }
  .badge-duvida    { background: #fef7e0; color: #b06000; }
  .badge-default   { background: #f1f3f4; color: #555; }

  .empty {
    text-align: center;
    padding: 48px;
    color: #aaa;
    font-size: 1rem;
  }

  .loading {
    text-align: center;
    padding: 48px;
    color: #888;
  }

  .spinner {
    display: inline-block;
    width: 28px; height: 28px;
    border: 3px solid #ddd;
    border-top-color: #1a73e8;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    background: #fce8e6;
    color: #c5221f;
    padding: 16px 20px;
    border-radius: 8px;
    margin: 16px 0;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<header>
  <span style="font-size:1.5rem">📋</span>
  <h1>Coleta de Dados</h1>
  <button class="reload-btn" onclick="carregar()">↻ Atualizar</button>
</header>

<div class="container">

  <!-- Cards -->
  <div class="cards">
    <div class="card">
      <div class="label">Total de registros</div>
      <div class="value" id="card-total">—</div>
    </div>
    <div class="card" style="border-color:#34a853">
      <div class="label">Elogios</div>
      <div class="value" style="color:#34a853" id="card-elogios">—</div>
    </div>
    <div class="card" style="border-color:#ea4335">
      <div class="label">Reclamações</div>
      <div class="value" style="color:#ea4335" id="card-reclamacoes">—</div>
    </div>
    <div class="card" style="border-color:#fbbc04">
      <div class="label">Sugestões / Dúvidas</div>
      <div class="value" style="color:#b06000" id="card-outros">—</div>
    </div>
  </div>

  <!-- Filtros -->
  <div class="filters">
    <div class="filter-group">
      <label>🔍 Busca geral</label>
      <input type="text" id="f-busca" placeholder="Qualquer campo..." oninput="filtrar()">
    </div>
    <div class="filter-group">
      <label>Mês</label>
      <select id="f-mes" onchange="filtrar()"><option value="">Todos</option></select>
    </div>
    <div class="filter-group">
      <label>Unidade</label>
      <select id="f-unidade" onchange="filtrar()"><option value="">Todas</option></select>
    </div>
    <div class="filter-group">
      <label>Canal</label>
      <select id="f-canal" onchange="filtrar()"><option value="">Todos</option></select>
    </div>
    <div class="filter-group">
      <label>Tipo</label>
      <select id="f-tipo" onchange="filtrar()"><option value="">Todos</option></select>
    </div>
    <div class="filter-group">
      <label>Categoria</label>
      <select id="f-categoria" onchange="filtrar()"><option value="">Todas</option></select>
    </div>
    <button class="btn-limpar" onclick="limparFiltros()">✕ Limpar</button>
  </div>

  <!-- Tabela -->
  <div class="table-wrap">
    <div class="table-info" id="table-info"></div>
    <div class="table-scroll">
      <div class="loading" id="loading">
        <div class="spinner"></div><br>Carregando dados...
      </div>
      <div id="error-msg" style="display:none"></div>
      <table id="tabela" style="display:none">
        <thead>
          <tr>
            <th>Mês</th>
            <th>Data</th>
            <th>Unidade</th>
            <th>Canal</th>
            <th>Tipo</th>
            <th>Categoria</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">Nenhum registro encontrado.</div>
    </div>
  </div>

</div>

<script>
const SHEET_ID = '1YUa7oCGS5KyYQeUP6UVlOOQCDVBOg0uiTTxnDxmmyeY';
const GID      = '1972543405';

let dadosOriginais = [];

function carregar() {
  mostrar('loading');
  // Remove script anterior se existir
  const velho = document.getElementById('gviz-script');
  if (velho) velho.remove();

  const script = document.createElement('script');
  script.id = 'gviz-script';
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&callback=onDadosCarregados`;
  script.src = url;
  script.onerror = () => {
    document.getElementById('error-msg').innerHTML =
      '<div class="error">⚠️ Não foi possível carregar os dados.<br><small>Verifique sua conexão com a internet.</small></div>';
    mostrar('error');
  };
  document.head.appendChild(script);
}

function onDadosCarregados(resposta) {
  try {
    const colunas = resposta.table.cols.map(c => c.label);
    const linhas  = resposta.table.rows;

    dadosOriginais = linhas.map(linha => {
      const cells = linha.c;
      function val(i) {
        const c = cells[i];
        if (!c || c.v === null || c.v === undefined) return '';
        // Datas vêm como "Date(2026,0,4)" — converte para DD/MM/AAAA
        if (typeof c.v === 'string' && c.v.startsWith('Date(')) {
          const partes = c.v.replace('Date(','').replace(')','').split(',');
          const d = new Date(+partes[0], +partes[1], +partes[2]);
          return d.toLocaleDateString('pt-BR');
        }
        return String(c.f || c.v).trim();
      }
      return {
        mes:       val(0),
        data:      val(1),
        unidade:   val(2),
        canal:     val(3),
        tipo:      val(4),
        categoria: val(5),
      };
    }).filter(d => d.mes || d.unidade || d.canal);

    popularFiltros();
    filtrar();
    mostrar('tabela');
  } catch(e) {
    document.getElementById('error-msg').innerHTML =
      '<div class="error">⚠️ Erro ao processar os dados.<br><small>' + e.message + '</small></div>';
    mostrar('error');
  }
}

function popularFiltros() {
  const campos = ['mes','unidade','canal','tipo','categoria'];
  const ids    = ['f-mes','f-unidade','f-canal','f-tipo','f-categoria'];
  campos.forEach((campo, i) => {
    const vals = [...new Set(dadosOriginais.map(d => d[campo]).filter(Boolean))].sort();
    const sel = document.getElementById(ids[i]);
    sel.innerHTML = '<option value="">Todos</option>';
    vals.forEach(v => {
      const op = document.createElement('option');
      op.value = v; op.textContent = v;
      sel.appendChild(op);
    });
  });
}

function filtrar() {
  const busca    = document.getElementById('f-busca').value.toLowerCase();
  const mes      = document.getElementById('f-mes').value;
  const unidade  = document.getElementById('f-unidade').value;
  const canal    = document.getElementById('f-canal').value;
  const tipo     = document.getElementById('f-tipo').value;
  const categoria= document.getElementById('f-categoria').value;

  const resultado = dadosOriginais.filter(d => {
    if (mes       && d.mes !== mes)           return false;
    if (unidade   && d.unidade !== unidade)   return false;
    if (canal     && d.canal !== canal)       return false;
    if (tipo      && d.tipo !== tipo)         return false;
    if (categoria && d.categoria !== categoria) return false;
    if (busca) {
      const tudo = Object.values(d).join(' ').toLowerCase();
      if (!tudo.includes(busca)) return false;
    }
    return true;
  });

  renderizar(resultado);
  atualizarCards(resultado);
}

function renderizar(dados) {
  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');
  const info  = document.getElementById('table-info');

  info.textContent = dados.length + ' registro(s) exibido(s)';

  if (dados.length === 0) {
    tbody.innerHTML = '';
    document.getElementById('tabela').style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  empty.style.display = 'none';
  document.getElementById('tabela').style.display = 'table';

  tbody.innerHTML = dados.map(d => `
    <tr>
      <td>${d.mes}</td>
      <td>${d.data}</td>
      <td>${d.unidade}</td>
      <td>${d.canal}</td>
      <td>${badgeTipo(d.tipo)}</td>
      <td>${d.categoria}</td>
    </tr>
  `).join('');
}

function badgeTipo(tipo) {
  const t = (tipo || '').toLowerCase();
  let cls = 'badge-default';
  if (t.includes('elogio'))     cls = 'badge-elogio';
  else if (t.includes('reclama')) cls = 'badge-reclamacao';
  else if (t.includes('sugest')) cls = 'badge-sugestao';
  else if (t.includes('d' + 'ú' + 'vida')) cls = 'badge-duvida';
  return `<span class="badge ${cls}">${tipo}</span>`;
}

function atualizarCards(dados) {
  document.getElementById('card-total').textContent      = dadosOriginais.length;
  document.getElementById('card-elogios').textContent    = dadosOriginais.filter(d => d.tipo.toLowerCase().includes('elogio')).length;
  document.getElementById('card-reclamacoes').textContent = dadosOriginais.filter(d => d.tipo.toLowerCase().includes('reclama')).length;
  document.getElementById('card-outros').textContent     = dadosOriginais.filter(d => {
    const t = d.tipo.toLowerCase();
    return !t.includes('elogio') && !t.includes('reclama');
  }).length;
}

function limparFiltros() {
  document.getElementById('f-busca').value = '';
  ['f-mes','f-unidade','f-canal','f-tipo','f-categoria'].forEach(id => {
    document.getElementById(id).value = '';
  });
  filtrar();
}

function mostrar(o) {
  document.getElementById('loading').style.display   = o === 'loading' ? 'block' : 'none';
  document.getElementById('error-msg').style.display = o === 'error'   ? 'block' : 'none';
  document.getElementById('empty').style.display     = 'none';
  if (o !== 'tabela') document.getElementById('tabela').style.display = 'none';
}

carregar();
</script>
</body>
</html>
